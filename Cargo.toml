[package]
name = "focusanchor"
version = "0.1.0"
edition = "2021"
description = "FocusAnchor - Ancoraggio anti-distrazione per ADHD e dislessia"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
rodio = { version = "0.19", default-features = false, features = ["mp3"] }
rand = "0.8"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
wry = "0.57.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
